name: Release

# Neue versionName in tool/lighttool.toml auf main → APK bauen →
# GitHub-Release v<versionName> mit genau einer .apk (so erwartet es BrightMarket).
# Gibt es den Release schon, passiert nichts.
on:
  push:
    branches: [main]
    paths: ['tool/lighttool.toml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -E '^versionName' tool/lighttool.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V existiert schon – nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: steps.ver.outputs.skip != 'true'
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.skip != 'true'

      - name: Tests + APK
        if: steps.ver.outputs.skip != 'true'
        run: ./gradlew -DlightSdk.toolOnly=true :tool:testDebugUnitTest :tool:assembleDebug --stacktrace

      - name: APK umbenennen
        if: steps.ver.outputs.skip != 'true'
        id: apk
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          SRC=$(ls tool/build/outputs/apk/debug/*.apk | head -1)
          OUT="fox-spur-light-${TAG}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release anlegen
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "FOX Spur Light ${{ steps.apk.outputs.tag }}" \
            --notes "Light-Phone-III-Tool zum Aufzeichnen und Navigieren beim Radfahren und Wandern. Installierbar über BrightMarket oder per Sideload."
