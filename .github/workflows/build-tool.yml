name: Tool bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK bauen + testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      # toolOnly = nur SDK + Tool, ohne Beispiele/Emulator → deutlich schneller
      - name: Tests
        run: ./gradlew -DlightSdk.toolOnly=true :tool:testDebugUnitTest --stacktrace

      - name: APK bauen (+ Lint-Regeln des SDK)
        run: ./gradlew -DlightSdk.toolOnly=true :tool:assembleDebug :tool:lintDebug --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: fox-spur-light-debug-apk
          path: tool/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Lint-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: tool/build/reports/lint-results-debug.html
          if-no-files-found: ignore
